apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: checklist
spec:
  selector:
    app: phpmyadmin
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: checklist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
        - name: phpmyadmin
          image: phpmyadmin:latest
          env:
            - name: PMA_HOST
              value: mysql
            - name: PMA_USER
              value: root
            - name: PMA_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: MYSQL_ROOT_PASSWORD } }
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { memory: "512Mi" }
