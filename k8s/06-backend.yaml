apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: checklist
spec:
  selector:
    app: backend
  ports:
    - port: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: checklist
spec:
  # Thay cho việc chép tay 2 service backend + backend2 trong compose. Muốn 3 replica chỉ
  # sửa 1 số ở đây — KHÔNG phải sửa thêm Caddyfile như trước, vì Service "backend" tự cân
  # bằng tải sang mọi pod đang Ready.
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    rollingUpdate:
      # Không cho phép tụt xuống dưới số replica hiện có trong lúc cập nhật -> deploy KHÔNG
      # gián đoạn dịch vụ, khác hẳn `docker compose up -d` (dừng cũ rồi mới dựng mới).
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'until nc -z mysql 3306 && nc -z minio 9000; do echo "cho mysql + minio..."; sleep 2; done'
      containers:
        - name: backend
          image: checklist-backend:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: MYSQL_PASSWORD } }
            - name: DATABASE_URL
              value: "mysql://canada_checklist_app:$(MYSQL_PASSWORD)@mysql:3306/canada_checklist"
            - name: MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: app-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: app-secrets, key: MINIO_ROOT_PASSWORD } }
            - name: DEEPSEEK_API_KEY
              valueFrom: { secretKeyRef: { name: app-secrets, key: DEEPSEEK_API_KEY } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: ADMIN_PASSWORD } }
            - name: APP_DOMAIN
              valueFrom: { secretKeyRef: { name: app-secrets, key: APP_DOMAIN } }
            - name: CORS_ORIGINS
              value: "https://$(APP_DOMAIN)"
            # 5 key Gemini. optional:true để thiếu key nào thì bỏ qua thay vì pod không khởi
            # động nổi — khớp đúng cách backend/llm.py xử lý (os.getenv, quét tới key đầu
            # tiên không có thì dừng).
            - name: GEMINI_API_KEYv1
              valueFrom: { secretKeyRef: { name: app-secrets, key: GEMINI_API_KEYv1, optional: true } }
            - name: GEMINI_API_KEYv2
              valueFrom: { secretKeyRef: { name: app-secrets, key: GEMINI_API_KEYv2, optional: true } }
            - name: GEMINI_API_KEYv3
              valueFrom: { secretKeyRef: { name: app-secrets, key: GEMINI_API_KEYv3, optional: true } }
            - name: GEMINI_API_KEYv4
              valueFrom: { secretKeyRef: { name: app-secrets, key: GEMINI_API_KEYv4, optional: true } }
            - name: GEMINI_API_KEYv5
              valueFrom: { secretKeyRef: { name: app-secrets, key: GEMINI_API_KEYv5, optional: true } }
          # readinessProbe quyết định pod có được nhận request hay không. Nhờ nó mà deploy
          # không rơi request nào: pod mới chỉ vào vòng cân bằng tải sau khi /health trả 200
          # (tức đã load xong Tesseract), pod cũ mới bị xoá.
          # ĐO THẬT trên cluster k3s: THIẾU khối lifecycle này, một lần rollout restart làm
          # rơi 59/16196 request (0,36%) — KHÔNG phải zero-downtime như người ta hay quảng cáo.
          #
          # Vì sao: lúc pod bị xoá, Kubernetes làm SONG SONG hai việc — gửi SIGTERM cho
          # container, và gỡ pod khỏi danh sách endpoint của Service. Không có gì bảo đảm
          # việc gỡ endpoint xong trước. Trong khe hở đó, Service vẫn còn chuyển request vào
          # một pod đã bắt đầu tắt -> connection refused.
          #
          # preStop sleep chặn đúng khe hở đó: SIGTERM bị hoãn 10s, đủ để mọi node cập nhật
          # xong bảng định tuyến, trong lúc pod vẫn phục vụ bình thường.
          # ĐO LẠI SAU KHI THÊM: 0 request lỗi.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          # livenessProbe KHỞI ĐỘNG LẠI pod khi nó treo. Đặt RẤT RỘNG RÃI cho app này:
          # route upload là hàm `def` đồng bộ, chiếm 1 luồng trong threadpool suốt 30-150s
          # (OCR + gọi LLM). Probe gắt sẽ giết pod GIỮA LÚC đang xử lý tài liệu của khách —
          # mất trắng công việc đang chạy, tệ hơn hẳn cái nó định sửa.
          # 10 lần x 15s = phải hỏng liên tục 150s mới khởi động lại.
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            # requests = phần CPU/RAM được GIỮ CHỖ, dùng để xếp pod vào node. limits = trần
            # cứng. 2 pod x 2 CPU = 4 CPU trần, còn 4 vCPU cho mysql/minio/caddy/frontend
            # trên VM e2-standard-8.
            requests: { cpu: "1", memory: "1Gi" }
            limits: { cpu: "2", memory: "4Gi" }
      # Cho pod 2 phút để xử lý nốt file đang OCR dở trước khi bị giết hẳn lúc deploy.
      # Mặc định chỉ 30s — quá ngắn so với 30-150s mà một file thật cần.
      terminationGracePeriodSeconds: 120
