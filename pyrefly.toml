# Cấu hình cho Pyrefly — bộ kiểm tra kiểu Python chạy trong IDE. KHÔNG ảnh hưởng gì lúc
# chạy thật (backend chạy trong Docker), chỉ để IDE báo lỗi đúng chỗ.

# 1. Thư viện. Mặc định Pyrefly hỏi interpreter mà IDE đang chọn — nếu IDE trỏ vào base
#    conda (/opt/miniconda3, Python 3.13) thì nó báo "Cannot find module `sqlalchemy`" dù
#    thư viện có đủ trong backend/.venv. Trỏ thẳng vào venv để không phụ thuộc IDE chọn gì.
#    backend/.venv nằm trong .gitignore — máy mới phải tự tạo:
#      python3.9 -m venv backend/.venv
#      backend/.venv/bin/pip install -r backend/requirements.txt
python-interpreter = "backend/.venv/bin/python"

# 2. Import anh em. Các module trong backend/ import nhau ở mức top-level (`from db import
#    ...`) vì lúc chạy thư mục làm việc là backend/, nên phải khai backend/ là import root.
search-path = ["backend"]

# 3. Production chạy Python 3.9 (backend/Dockerfile). Để IDE kiểm theo 3.13 thì cú pháp chỉ
#    có ở bản mới sẽ lọt qua ở máy dev và chỉ vỡ khi đã lên production.
python-version = "3.9"

# models.py khai cột theo kiểu CŨ của SQLAlchemy (`id = Column(String(191), ...)`) chứ
# không phải kiểu 2.0 (`id: Mapped[str] = mapped_column(...)`). Với kiểu cũ, bộ kiểm tra
# kiểu thấy `case.id` là `Column[str]` chứ không phải `str` — trong khi lúc chạy thật
# SQLAlchemy trả về đúng giá trị. Đo được: bật đủ 3 nhóm lỗi này lên thì backend/ có 211
# lỗi, tắt đi còn 11 — tức ~200 lỗi là báo nhầm vì kiểu khai cột, không phải bug thật.
# Muốn bật lại 3 dòng dưới thì phải chuyển hết 60 cột trong models.py sang `Mapped[...]` +
# `mapped_column(...)` trước, đừng chỉ xoá dòng.
[errors]
bad-argument-type = false
bad-assignment = false
no-matching-overload = false
bad-index = false
