services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: canada_checklist
      MYSQL_USER: canada_checklist_app
      MYSQL_PASSWORD: CanadaChecklist2026!
      MYSQL_ROOT_PASSWORD: CanadaChecklistRoot2026!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pCanadaChecklistRoot2026!"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: canada_checklist_app
      MINIO_ROOT_PASSWORD: CanadaChecklistMinio2026!
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  minio_data:
