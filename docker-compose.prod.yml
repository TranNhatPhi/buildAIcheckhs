# Compose PRODUCTION — chạy trên VM GCP, gộp cả app (frontend/backend) lẫn hạ tầng
# (mysql/minio) thành 1 stack duy nhất. Tách riêng khỏi docker-compose.yml (chỉ có
# mysql/minio/phpmyadmin, dùng cho dev cục bộ — frontend/backend dev chạy trực tiếp trên
# máy qua `npm run dev`/`uvicorn`, không qua Docker) để không xáo trộn workflow dev hiện tại.
#
# Chạy: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Xem hướng dẫn đầy đủ (tạo VM, DNS, HTTPS...) trong tài liệu deploy đi kèm.
#
# backend chạy 2 replica (backend, backend2) đứng sau Caddy load-balancing (xem Caddyfile) —
# mỗi replica chỉ 1 uvicorn worker (backend/Dockerfile) để tổng số process (2) khớp đúng số
# vCPU của e2-medium (2 vCPU). Nâng cấp VM lên nhiều vCPU hơn thì thêm backend3/backend4 vào
# đây VÀ vào danh sách reverse_proxy trong Caddyfile — 2 chỗ phải sửa cùng lúc.

x-backend-common: &backend-common
  build: ./backend
  restart: unless-stopped
  environment:
    DATABASE_URL: mysql://canada_checklist_app:${MYSQL_PASSWORD}@mysql:3306/canada_checklist
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: canada-checklist-docs
    DEEPSEEK_BASE_URL: https://api.deepseek.com
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    # Key dự phòng cho round-robin (backend/classify.py:59-67) — optional, thiếu thì code tự
    # bỏ qua (os.getenv, không phải os.environ), pool chỉ còn lại DEEPSEEK_API_KEY.
    LLM_API_KEY_2: ${LLM_API_KEY_2:-}
    LLM_API_KEY_3: ${LLM_API_KEY_3:-}
    LLM_API_KEY_4: ${LLM_API_KEY_4:-}
    DEEPSEEK_MODEL: deepseek-v4-flash
    # ── Gemini: nguồn CHÍNH cho OCR + sửa lỗi + phân loại + phân tích sâu ──────────────
    # DeepSeek ở trên giờ chỉ còn là dự phòng khi hết hạn mức free của Gemini (xem
    # backend/llm.py). Thiếu hết các key này thì app VẪN CHẠY — chỉ là mọi thứ rơi về
    # DeepSeek (tốn tiền) và OCR rơi về Tesseract (đọc kém hơn hẳn với giấy nền hoa văn).
    #
    # Đánh số LIÊN TỤC v1, v2, v3... — backend quét từ v1 và DỪNG ở số đầu tiên không có,
    # nên .env.prod nhảy cóc (chỉ có v1 và v3) sẽ khiến v3 bị bỏ qua âm thầm.
    GEMINI_API_KEYv1: ${GEMINI_API_KEYv1:-}
    GEMINI_API_KEYv2: ${GEMINI_API_KEYv2:-}
    GEMINI_API_KEYv3: ${GEMINI_API_KEYv3:-}
    GEMINI_API_KEYv4: ${GEMINI_API_KEYv4:-}
    GEMINI_API_KEYv5: ${GEMINI_API_KEYv5:-}
    # Khai sẵn dư vài slot: thêm key mới chỉ cần sửa .env.prod, KHÔNG phải sửa file này rồi
    # build lại. Slot bỏ trống là chuỗi rỗng, backend tự bỏ qua — không tốn gì.
    GEMINI_API_KEYv6: ${GEMINI_API_KEYv6:-}
    GEMINI_API_KEYv7: ${GEMINI_API_KEYv7:-}
    GEMINI_API_KEYv8: ${GEMINI_API_KEYv8:-}
    # Các biến tinh chỉnh dưới đây ĐỀU CÓ MẶC ĐỊNH trong code — để rỗng là dùng mặc định
    # (backend/llm.py coi chuỗi rỗng như chưa đặt, cố ý xử lý vậy vì cú pháp `${X:-}` của
    # Compose LUÔN set biến, chỉ là set thành rỗng). Có mặt ở đây để đổi được trên VM mà
    # không phải sửa code + build lại image:
    #   GEMINI_OCR_ENABLED=0  -> tắt hẳn OCR bằng Gemini, quay về Tesseract. Đây là CÔNG TẮC
    #       KHẨN nếu phát hiện Gemini bịa nội dung (rủi ro có thật của LLM đọc ảnh — xem
    #       ghi chú ở gemini_ocr_page trong backend/ocr.py).
    #   GEMINI_MODELS / GEMINI_LITE_MODELS -> đổi model khi Google ngừng/đổi tên model.
    GEMINI_OCR_ENABLED: ${GEMINI_OCR_ENABLED:-}
    GEMINI_MODELS: ${GEMINI_MODELS:-}
    GEMINI_LITE_MODELS: ${GEMINI_LITE_MODELS:-}
    CONFIDENCE_THRESHOLD: "0.6"
    CORS_ORIGINS: https://${APP_DOMAIN}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  depends_on:
    mysql:
      condition: service_healthy
    minio:
      condition: service_healthy
  # Không expose port ra host — chỉ Caddy (reverse proxy) mới cần thấy backend, qua tên
  # service trong mạng nội bộ Docker.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: canada_checklist
      MYSQL_USER: canada_checklist_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # KHÔNG mở port 3306 ra ngoài host — backend/phpMyAdmin (nếu cần) truy cập qua mạng nội
    # bộ Docker bằng tên service "mysql", không cần expose ra internet.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Bắt buộc phải có khi Console chạy sau reverse proxy trên domain riêng — thiếu biến
      # này, Console vẫn đăng nhập được (như đã xác nhận) nhưng trang trắng xoá sau đó vì JS
      # không biết gọi API vào đâu.
      MINIO_BROWSER_REDIRECT_URL: https://${STORAGE_DOMAIN}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Tương tự mysql — không expose port ra host, backend gọi qua tên service "minio". Console
    # web (cổng 9001, bật qua --console-address ở command trên) cũng không expose ra host —
    # Caddy reverse_proxy thẳng vào "minio:9001" qua mạng nội bộ Docker (xem Caddyfile).

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    # Không expose port ra host — chỉ Caddy mới thấy được (basic_auth chặn trước, xem Caddyfile).

  backend:
    <<: *backend-common

  backend2:
    <<: *backend-common

  frontend:
    build:
      context: .
      args:
        # Bake vào JS bundle lúc build — PHẢI là domain PUBLIC (https://api.yourdomain.com),
        # vì đây là URL mà TRÌNH DUYỆT của nhân viên gọi trực tiếp, không phải URL nội bộ
        # Docker network như backend ở trên.
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    restart: unless-stopped

  # Nghe webhook GitHub (push → tự git pull + deploy.sh) — xem deploy-webhook.py để biết vì
  # sao chạy dạng container thay vì systemd (VM không cấp quyền sudo cho tài khoản đang dùng).
  deploy-webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    restart: unless-stopped
    # QUAN TRỌNG: container này chạy `git pull` trực tiếp lên thư mục repo bind-mount CHUNG
    # với host (xem comment "volumes" bên dưới) — nếu chạy mặc định (root, UID 0), git tạo
    # ra object mới trong .git/objects thuộc sở hữu root. Lần sau tài khoản host (không có
    # sudo) tự chạy ./deploy.sh thủ công sẽ gặp "insufficient permission for adding an
    # object" vì không ghi đè được lên các file root đã tạo. Ép container chạy đúng UID:GID
    # của tài khoản host (deploy.sh tự tính bằng `id -u`/`id -g`, KHÔNG hard-code) để mọi
    # object git tạo ra — dù từ webhook hay từ tay — luôn cùng 1 chủ sở hữu.
    user: "${DEPLOY_UID}:${DEPLOY_GID}"
    # group_add (không phải đổi group chính) để vẫn ghi/đọc được /var/run/docker.sock (thuộc
    # group "docker" của host) mà không làm lệch chủ sở hữu (group) của file git vừa tạo ra.
    group_add:
      - "${DOCKER_SOCK_GID}"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      # PHẢI khớp đúng đường dẫn thật trên host — xem giải thích chi tiết trong deploy-webhook.py.
      REPO_DIR: /home/nhatphivt2005/buildAIcheckhs
      # UID tuỳ ý (không có entry trong /etc/passwd của image) không tự suy ra được $HOME —
      # khai rõ để `git config --global` (deploy-webhook.py) có chỗ ghi ~/.gitconfig.
      HOME: /tmp
    volumes:
      # Mount TRÙNG đường dẫn tuyệt đối với host (không phải "./:/repo" hay tương tự) — bắt
      # buộc cho Docker-outside-of-Docker, xem giải thích trong deploy-webhook.py.
      - .:/home/nhatphivt2005/buildAIcheckhs
      - /var/run/docker.sock:/var/run/docker.sock
    # Không expose port ra host — chỉ Caddy mới cần gọi vào, qua tên service nội bộ Docker.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      DB_DOMAIN: ${DB_DOMAIN}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN}
      ADMIN_TOOLS_PASSWORD_HASH: ${ADMIN_TOOLS_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - backend2
      - phpmyadmin
      - deploy-webhook

volumes:
  mysql_data:
  minio_data:
  caddy_data:
  caddy_config:
